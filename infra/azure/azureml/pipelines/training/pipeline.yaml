$schema: https://azuremlschemas.azureedge.net/latest/pipelineJob.schema.json
type: pipeline

display_name: Hyperopt Pipeline

settings:
  default_datastore: azureml:workspaceblobstore
  default_compute: azureml:dedicated-cpu
  continue_on_step_failure: false
  force_rerun: true

inputs:
  batch_size: 128
  num_workers: 4
  prefetch_factor: 4
  num_epochs: 10
  dev_mode: false

jobs:
  prepare_data_job:
    type: command
    component: ./prepare_data.yaml
    compute: azureml:dedicated-cpu
    outputs:
      data_output:

  hyperopt_job:
    type: sweep
    trial: ./train.yaml
    compute: azureml:dedicated-cpu
    inputs:
      data_input: ${{parent.jobs.prepare_data_job.outputs.data_output}}
      batch_size: ${{parent.inputs.batch_size}}
      num_workers: ${{parent.inputs.num_workers}}
      prefetch_factor: ${{parent.inputs.prefetch_factor}}
      num_epochs: ${{parent.inputs.num_epochs}}
      dev_mode: ${{parent.inputs.dev_mode}}
    outputs:
      checkpoint_output:
    sampling_algorithm: random
    search_space:
      horizontal_flip_prob:
        type: uniform
        min_value: 0.1
        max_value: 0.9
      rotation_range:
        type: randint
        upper: 30
      learning_rate:
        type: uniform
        min_value: 0.0001
        max_value: 0.01
    objective:
      primary_metric: val_f1_score
      goal: maximize
    limits:
      max_total_trials: 20
      max_concurrent_trials: 4
    early_termination:
      type: median_stopping
      evaluation_interval: 1
      delay_evaluation: 5
    
  evaluation_job:
    type: command
    component: ./evaluate.yaml
    compute: azureml:dedicated-cpu
    inputs:
      data_input: ${{parent.jobs.prepare_data_job.outputs.data_output}}
      checkpoint_input: ${{parent.jobs.hyperopt_job.outputs.checkpoint_output}}
      batch_size: ${{parent.inputs.batch_size}}
      num_workers: ${{parent.inputs.num_workers}}
      prefetch_factor: ${{parent.inputs.prefetch_factor}}
      dev_mode: ${{parent.inputs.dev_mode}}
