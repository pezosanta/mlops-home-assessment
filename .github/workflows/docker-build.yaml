name: Docker Build

on: 
  push:
    # branches:
    # - master
    
  workflow_dispatch:
    # inputs:
    #   experiment_name:
    #     description: Experiment name of the current training run.
    #     type: string
    #     required: true

jobs:
  build:
    name: Build Docker image and push to Azure Container Registry
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository with GIT LFS
        uses: actions/checkout@v4
        with:
            lfs: true
            fetch-depth: 0
            fetch-tags: true
      - name: Prepare Docker Build Context and Install Build Requirements
        run: |
            source scripts/install-requirements-build.sh
            source docker/configure.sh
            source docker/create_build_context.sh
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Azure Container Registry
        uses: azure/docker-login@v2
        with:
            login-server: ${{ secrets.ACR_SERVER }} # default: index.docker.io
            username: ${{ secrets.ACR_USERNAME }}
            password: ${{ secrets.ACR_PASSWORD }}
      - name: Build and Push TRAIN image to ACR
        uses: docker/build-push-action@v6
        with:
            push: true
            tags: train:latest
            file: docker/Dockerfile
            context: docker/
            target: train
            build-args: |
                PYTHON_V="python3.10"

                

    
    
